name: Build, Test & Upload Artifact

on:
  push:
    branches: [master, main, 'dev/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: shadowJar
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkGame-Artifact
          path: build/libs/SkGame*.jar

  test:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v3
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: extra-plugins/
          merge-multiple: true
      - name: Run Skript tests
        id: skript_tests
        uses: SkriptLang/skript-test-action@v1.3
        with:
          test_script_directory: src/test/scripts
          # v1.3 uses openjdk25 — matches SkGame's Java 25 / Gradle 9.7.1 / Paper 26.2 stack.
          # Pin Skript to same version SkGame was compiled against for API compatibility.
          skript_repo_ref: 2.16.2
          extra_plugins_directory: extra-plugins/
          run_vanilla_tests: 'false'
